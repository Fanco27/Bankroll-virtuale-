name: Bankroll virtuale - test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test del modello e del bankroll esclusivamente virtuale
        run: python -m unittest discover -v
      - name: Verifica interfaccia CLI
        run: python bankroll.py --help
      - name: Backtest storico e confronto con il riferimento
        run: |
          python bankroll.py storico_serie_a.csv --min-train 100 --output report.json
          python verify_history.py report.json
